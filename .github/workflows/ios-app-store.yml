# Builds Deepforge for iOS and uploads it to App Store Connect (it then appears in TestFlight).
#
# Run it from GitHub: Actions > "iOS build to App Store Connect" > Run workflow,
# or push a tag like v1.0.0.
#
# Job 1 (Linux, Unity via GameCI) exports the Xcode project.
# Job 2 (macOS) installs CocoaPods, signs with the App Store Connect API key and uploads.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE    contents of C:\ProgramData\Unity\Unity_lic.ulf
#   UNITY_EMAIL      Unity account email
#   UNITY_PASSWORD   Unity account password
#   APPLE_TEAM_ID    10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    App Store Connect API issuer ID
#   ASC_KEY_P8       full contents of the AuthKey_XXXXXXXXXX.p8 file

name: iOS build to App Store Connect

on:
  workflow_dispatch:
    inputs:
      debug_tools:
        description: "Include debug tools (TestFlight testing only, never submit to the App Store)"
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  unity-export:
    name: Export Xcode project (Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the Unity iOS image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildName: iOS
          buildMethod: IdleMine.EditorTools.CiBuild.BuildIos
          customParameters: ${{ inputs.debug_tools && '-debugTools' || '' }}

      - name: Pack Xcode project
        run: sudo tar -czf xcode-project.tar.gz -C build/iOS iOS

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tar.gz
          compression-level: 0
          retention-days: 1

  xcode-upload:
    name: Build, sign and upload (Xcode)
    needs: unity-export
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ARCHIVE: ${{ github.workspace }}/Deepforge.xcarchive
      KEY_PATH: ${{ github.workspace }}/AuthKey.p8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Unpack
        run: tar -xzf xcode-project.tar.gz

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods dependencies (Google Mobile Ads)
        working-directory: iOS
        run: pod install --repo-update

      - name: Set build number
        working-directory: iOS
        # Every run gets a higher build number than the last, as App Store Connect requires.
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"

      - name: Archive (unsigned)
        working-directory: iOS
        # Signing for development here would need a registered test device. The export step below signs
        # the whole app for App Store distribution instead, which needs none.
        run: |
          xcodebuild archive \
            -workspace Unity-iPhone.xcworkspace \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export and upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "${{ github.workspace }}/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
